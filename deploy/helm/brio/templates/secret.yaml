{{- if not .Values.existingSecret }}
{{- range $k := list "DATABASE_URL" "BETTER_AUTH_SECRET" }}
{{- if not (index $.Values.secrets $k) }}
{{- fail (printf "secrets.%s is required (or set existingSecret)" $k) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "brio.fullname" . }}
  labels: {{- include "brio.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $k, $v := .Values.secrets }}
{{- if $v }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
{{- end }}
