# The one process that runs missions (BRIO_API_ROLE=worker). Exactly one: the old pod stops before the new one starts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "brio.fullname" . }}-worker
  labels: {{- include "brio.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "brio.selector" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "brio.selector" (dict "root" . "component" "worker") | nindent 8 }}
      annotations:
        checksum/env: {{ toJson .Values.env | sha256sum | trunc 16 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "brio.image" (dict "root" . "name" .Values.image.api) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 4000 }
          env:
            {{- include "brio.env" . | nindent 12 }}
            - { name: APP_URL, value: {{ .Values.appUrl | quote }} }
            - { name: PORT, value: "4000" }
            - { name: BRIO_API_ROLE, value: worker }
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            failureThreshold: 4
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
