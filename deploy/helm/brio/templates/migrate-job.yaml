{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "brio.fullname" . }}-migrate-{{ .Release.Revision }}
  labels: {{- include "brio.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: {{- include "brio.selector" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "brio.image" (dict "root" . "name" .Values.image.api) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /app/packages/db
          command: ["node", "--import", "tsx", "src/scripts/migrate.ts"]
          env: {{- include "brio.env" . | nindent 12 }}
{{- end }}
