apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "brio.fullname" . }}-api
  labels: {{- include "brio.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {{- include "brio.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "brio.selector" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        checksum/env: {{ toJson .Values.env | sha256sum | trunc 16 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "brio.image" (dict "root" . "name" .Values.image.api) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 4000 }
          env:
            {{- include "brio.env" . | nindent 12 }}
            - { name: APP_URL, value: {{ .Values.appUrl | quote }} }
            - { name: PORT, value: "4000" }
            - { name: BRIO_API_ROLE, value: web }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            failureThreshold: 4
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "brio.fullname" . }}-api
  labels: {{- include "brio.labels" . | nindent 4 }}
spec:
  selector: {{- include "brio.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.apiPort }}, targetPort: http }
