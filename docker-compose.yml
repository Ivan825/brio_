# Local infrastructure. `docker compose up -d` then `pnpm db:migrate`.
name: brio

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    # Tests, the eval harness and a dev server each open pools of their own; 100 connections run out.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: brio
      POSTGRES_PASSWORD: brio
      POSTGRES_DB: brio
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brio -d brio"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
