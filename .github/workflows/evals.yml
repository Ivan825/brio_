name: evals

# The golden-mission evals, offline: simulated agents of known skill, no keys and no vendor calls (D-61). Live evals
# with real agents run on the owner's machine (`pnpm evals --live`), never in Actions.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: brio
          POSTGRES_PASSWORD: brio
          POSTGRES_DB: brio
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U brio -d brio" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://brio:brio@localhost:5433/brio
      TEST_DATABASE_URL: postgres://brio:brio@localhost:5433/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run every golden mission under every strategy
        run: pnpm --filter @brio/evals evals --out "$GITHUB_WORKSPACE/eval-results"
      - name: Metrics table in the job summary
        if: always()
        run: cat eval-results/*.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: eval-results
